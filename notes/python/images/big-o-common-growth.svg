<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Common Big O growth rates</title>
  <desc id="desc">A line graph comparing constant, logarithmic, linear, linearithmic, and quadratic growth from input size zero through eight.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#172033">Common growth rates</text>
  <text x="450" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5b6475">Illustrative operation counts for small inputs</text>

  <g stroke="#d9dee8" stroke-width="1">
    <line x1="100" y1="450" x2="740" y2="450"/>
    <line x1="100" y1="363" x2="740" y2="363"/>
    <line x1="100" y1="275" x2="740" y2="275"/>
    <line x1="100" y1="188" x2="740" y2="188"/>
    <line x1="100" y1="100" x2="740" y2="100"/>
  </g>

  <g stroke="#172033" stroke-width="2">
    <line x1="100" y1="80" x2="100" y2="450"/>
    <line x1="100" y1="450" x2="760" y2="450"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#5b6475">
    <text x="85" y="455" text-anchor="end">0</text>
    <text x="85" y="368" text-anchor="end">16</text>
    <text x="85" y="280" text-anchor="end">32</text>
    <text x="85" y="193" text-anchor="end">48</text>
    <text x="85" y="105" text-anchor="end">64</text>
    <text x="100" y="475" text-anchor="middle">0</text>
    <text x="180" y="475" text-anchor="middle">1</text>
    <text x="260" y="475" text-anchor="middle">2</text>
    <text x="340" y="475" text-anchor="middle">3</text>
    <text x="420" y="475" text-anchor="middle">4</text>
    <text x="500" y="475" text-anchor="middle">5</text>
    <text x="580" y="475" text-anchor="middle">6</text>
    <text x="660" y="475" text-anchor="middle">7</text>
    <text x="740" y="475" text-anchor="middle">8</text>
    <text x="425" y="515" text-anchor="middle" font-size="15" fill="#172033">Input size (n)</text>
    <text x="25" y="270" text-anchor="middle" font-size="15" fill="#172033" transform="rotate(-90 25 270)">Approximate operations</text>
  </g>

  <polyline points="180,445 260,445 340,445 420,445 500,445 580,445 660,445 740,445" fill="none" stroke="#59636f" stroke-width="4"/>
  <polyline points="180,450 260,445 340,441 420,439 500,437 580,436 660,435 740,434" fill="none" stroke="#7a52c7" stroke-width="4"/>
  <polyline points="180,445 260,439 340,434 420,428 500,423 580,417 660,412 740,406" fill="none" stroke="#168aad" stroke-width="4"/>
  <polyline points="180,450 260,439 340,424 420,406 500,387 580,365 660,343 740,319" fill="none" stroke="#e07a16" stroke-width="4"/>
  <polyline points="180,445 260,428 340,401 420,363 500,313 580,253 660,182 740,100" fill="none" stroke="#c43d4f" stroke-width="4"/>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    <text x="780" y="449" fill="#59636f">O(1)</text>
    <text x="780" y="431" fill="#7a52c7">O(log n)</text>
    <text x="780" y="409" fill="#168aad">O(n)</text>
    <text x="780" y="323" fill="#e07a16">O(n log n)</text>
    <text x="780" y="105" fill="#c43d4f">O(n²)</text>
  </g>
</svg>
