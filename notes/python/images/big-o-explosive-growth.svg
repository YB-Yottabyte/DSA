<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
  <title id="title">Explosive Big O growth rates</title>
  <desc id="desc">A logarithmic line graph comparing quadratic, exponential, and factorial growth from input size one through ten.</desc>
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#172033">Exponential and factorial growth</text>
  <text x="450" y="59" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5b6475">Logarithmic vertical scale — each grid line is about 10× larger</text>

  <g stroke="#d9dee8" stroke-width="1">
    <line x1="120" y1="460" x2="750" y2="460"/>
    <line x1="120" y1="407" x2="750" y2="407"/>
    <line x1="120" y1="354" x2="750" y2="354"/>
    <line x1="120" y1="301" x2="750" y2="301"/>
    <line x1="120" y1="249" x2="750" y2="249"/>
    <line x1="120" y1="196" x2="750" y2="196"/>
    <line x1="120" y1="143" x2="750" y2="143"/>
    <line x1="120" y1="90" x2="750" y2="90"/>
  </g>

  <g stroke="#172033" stroke-width="2">
    <line x1="120" y1="75" x2="120" y2="460"/>
    <line x1="120" y1="460" x2="770" y2="460"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#5b6475">
    <text x="105" y="465" text-anchor="end">1</text>
    <text x="105" y="412" text-anchor="end">10</text>
    <text x="105" y="359" text-anchor="end">100</text>
    <text x="105" y="306" text-anchor="end">1,000</text>
    <text x="105" y="254" text-anchor="end">10,000</text>
    <text x="105" y="201" text-anchor="end">100,000</text>
    <text x="105" y="148" text-anchor="end">1,000,000</text>
    <text x="105" y="95" text-anchor="end">10,000,000</text>
    <text x="120" y="485" text-anchor="middle">1</text>
    <text x="190" y="485" text-anchor="middle">2</text>
    <text x="260" y="485" text-anchor="middle">3</text>
    <text x="330" y="485" text-anchor="middle">4</text>
    <text x="400" y="485" text-anchor="middle">5</text>
    <text x="470" y="485" text-anchor="middle">6</text>
    <text x="540" y="485" text-anchor="middle">7</text>
    <text x="610" y="485" text-anchor="middle">8</text>
    <text x="680" y="485" text-anchor="middle">9</text>
    <text x="750" y="485" text-anchor="middle">10</text>
    <text x="435" y="525" text-anchor="middle" font-size="15" fill="#172033">Input size (n)</text>
    <text x="28" y="270" text-anchor="middle" font-size="15" fill="#172033" transform="rotate(-90 28 270)">Approximate operations</text>
  </g>

  <polyline points="120,460 190,428 260,410 330,396 400,386 470,378 540,371 610,365 680,359 750,354" fill="none" stroke="#168aad" stroke-width="4"/>
  <polyline points="120,444 190,428 260,412 330,396 400,380 470,365 540,349 610,333 680,317 750,301" fill="none" stroke="#e07a16" stroke-width="4"/>
  <polyline points="120,460 190,444 260,419 330,387 400,350 470,309 540,264 610,217 680,166 750,113" fill="none" stroke="#c43d4f" stroke-width="4"/>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    <text x="785" y="358" fill="#168aad">O(n²)</text>
    <text x="785" y="305" fill="#e07a16">O(2ⁿ)</text>
    <text x="785" y="117" fill="#c43d4f">O(n!)</text>
  </g>
</svg>
